# PhilFindsJobs web server (Web01 and Web02 use this same file broo)  writer--Philbert
# script/setup-web.sh replaces WEB_NAME with Web01 or Web02 and install it as /etc/nginx/sites-available/PhilFindsJobs
proxy_cache_path /var/cache/nginx/PhilFindsJobs levels=1:2 keys_zone=PhilFindsJobs_api:10m max_size=50m inactive=60m use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/PhilFindsJobs;
    index index.html;

    #Identify this server + security headers.
    add_header X-Served-By "WEB_NAME" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://www.arbeitnow.com https://remotive.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always; 
    add_header X-Cache-Status $upstream_cache_status always;
    
    # api proxy settings : avoids browser cors limmit and caches response for 15minutues
    # the resolver lets nginx start even if dns is briefly unvailable
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Accept "application/json";
    proxy_set_header Accept-Encoding "";
    proxy_set_header User-Agent "PhilFindsJobs/1.0 (student project)";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_cache PhilFindsJobs_api;
    proxy_cache_valid 200 15m;
    proxy_cache_valid any 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_5003 http_504;
    proxy_cache_lock on;

    location = /api/arbeitnow/ {
        limit_except GET { deny all; }
        set $api https://www.arbeitnow.com/api/job-board-api;
        proxy_set_header Host www.arbeitnow.com;
        proxy_pass $api$is_args$args;
    }

    location = /api/remotive/ {
        limit_except GET { deny all; }
        set $api https://remotive.com/api/remote-jobs;
        proxy_set_header Host remotive.com;
    }

    #used to prove load balancing
    location = /server-info {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Served-By "WEB_NAME" always;
        return 200 '{"server":"WEB_NAME","status":"ok"}';
    }

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }     # never serve hidden files (.git, .env, ... )

}
