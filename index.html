<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PhilFindsJobs - Find your next job</title>
        <link rel="stylesheet" href="">
        <script src="" defer></script>
    </head>

    <body>
        <nav class="navbar">
            <a href="#" class="logo"><span class="logo-badge">PFJ</span>PhilFindsJobs</a>
            <ul class="nav-links">
                <li><a href="#search">Home</a></li>
                <li><a href="#results" data-tab="all">Jobs</a></li>
                <li><a href="#results" data-tab="remote">Remote</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#results" data-tab="saved">Saved (<span id="savedCount">0</span>)</a></li>
            </ul>
        </nav>

        <main class="container">
            <section class="hero" id="search">
                <p class="label">Job search · Arbeitnow + Remotive</p>
                <h1>Find work that <br><span class="accent">moves you forward.</span></h1>
                <p class="muted">Search jobs from two job boards in one place, then apply on the original listening.</p>
                <form id="searchForm" class="search">
                    <input type="search" id="keyword" maxlength="100" placeholder="Job title, skill or company">
                    <input type="search" id="place" maxlength="100" placeholder="City, country or remote">
                    <button class="btn"></button>
                </form>
            </section>

            <section class="toolbar" id="results">
                <div class="tabs">
                    
                </div>
            </section>
        </main>
    </body>
</html>
